name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  API_APP_NAME: ${{ vars.API_APP_NAME }}
  WEB_APP_NAME: ${{ vars.WEB_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Resolve registry and API URL
        id: meta
        run: |
          ACR_LOGIN=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          API_FQDN=$(az containerapp show \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "acr_login=$ACR_LOGIN" >> "$GITHUB_OUTPUT"
          echo "api_url=https://$API_FQDN" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        run: |
          IMAGE="${{ steps.meta.outputs.acr_login }}/hackyeah-api:${{ github.sha }}"
          LATEST="${{ steps.meta.outputs.acr_login }}/hackyeah-api:latest"
          docker build -f backend/docker/Dockerfile -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push web image
        run: |
          IMAGE="${{ steps.meta.outputs.acr_login }}/hackyeah-web:${{ github.sha }}"
          LATEST="${{ steps.meta.outputs.acr_login }}/hackyeah-web:latest"
          docker build -f backend/docker/Dockerfile.frontend \
            --build-arg "VITE_API_URL=${{ steps.meta.outputs.api_url }}" \
            -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "WEB_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update Container Apps
        run: |
          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$API_IMAGE"

          WEB_FQDN=$(az containerapp show \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)

          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars "CORS_ORIGINS=[\"https://${WEB_FQDN}\"]"

          az containerapp update \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$WEB_IMAGE"
