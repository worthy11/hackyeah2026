# SPA + reverse-proxy to the API.
# Placeholders replaced at image build:
#   __API_UPSTREAM__  e.g. https://ca-hackyeah-api.….azurecontainerapps.io
#   __API_HOST__      hostname only (for Host / SNI)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass __API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ws/ {
        proxy_pass __API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /media/ {
        proxy_pass __API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass __API_UPSTREAM__/health;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
