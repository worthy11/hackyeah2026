# Local dev: only the DB runs in Docker.
# Start with:  docker compose up -d
# Then run backend:  cd backend && uvicorn main:app --reload
# And frontend:      cd frontend && npm run dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/app
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Runs: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile.frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  pgdata:
